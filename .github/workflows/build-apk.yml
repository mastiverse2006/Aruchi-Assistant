name: Build Durefishan Assistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "debug.keystore is already present."
          else
            echo "debug.keystore.base64 not found, proceeding with default Android SDK keystore if available."
          fi

      - name: Configure environment credentials
        run: |
          if [ ! -f ".env" ]; then
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
              echo "Configured .env using GitHub repository secret GEMINI_API_KEY."
            elif [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Copied .env.example to .env (placeholder key)."
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit and Robolectric tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Android Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK file generated
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Durefishan-Assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
